name: UZARO iOS release

# Builds the signed iOS app on a GitHub macOS runner and uploads it to App Store Connect (TestFlight).
# Signing is Xcode's automatic (cloud-managed) signing driven by an App Store Connect API key with the
# Admin role, so no certificate or profile is kept in the repo.
# Repo secrets: APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_KEY_P8 (the .p8 file's text), TG_API_ID, TG_API_HASH.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to App Store Connect (off = only build the archive)
        type: boolean
        default: true

concurrency:
  group: ios-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.7"
  # Keep in sync with mobile.yml and mobile/tool/build_tdlib_ios.sh.
  TDLIB_COMMIT: "c15d3f5a5"
  TEAM_ID: Q3W9P2M682
  ASC_ISSUER_ID: 60987b8a-7e8f-49dd-abb0-68a245a4ff37

defaults:
  run:
    working-directory: mobile

jobs:
  ios:
    name: Build, sign and upload
    runs-on: macos-26
    timeout-minutes: 300
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
    steps:
      - name: Check secrets
        working-directory: .
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_KEY_P8 TG_API_ID TG_API_HASH; do
            if [ -z "${!name}" ]; then echo "::error::Secret for $name is not set"; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@v4

      # App Store Connect only accepts builds made with a released Xcode and the iOS 26 SDK or later.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Restore iOS tdjson.xcframework
        id: tdlib-ios
        uses: actions/cache/restore@v4
        with:
          path: mobile/ios/TDLib/tdjson.xcframework
          key: tdlib-ios-${{ env.TDLIB_COMMIT }}-v1

      - name: Build tdjson.xcframework
        if: steps.tdlib-ios.outputs.cache-hit != 'true'
        run: |
          brew install gperf cmake coreutils
          bash tool/build_tdlib_ios.sh "$RUNNER_TEMP/tdlib-ios"

      # Saved right away so a later failing step doesn't throw away the ~50 min TDLib build.
      - name: Save iOS tdjson.xcframework
        if: steps.tdlib-ios.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mobile/ios/TDLib/tdjson.xcframework
          key: tdlib-ios-${{ env.TDLIB_COMMIT }}-v1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: API key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          key="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          # Secrets pasted on Windows carry \r, which CryptoKit rejects as an invalid PEM document.
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$key"
          if ! grep -q -- '-----BEGIN PRIVATE KEY-----' "$key" || ! grep -q -- '-----END PRIVATE KEY-----' "$key"; then
            echo "::error::APP_STORE_CONNECT_KEY_P8 must be the full text of AuthKey_${ASC_KEY_ID}.p8, from -----BEGIN PRIVATE KEY----- to -----END PRIVATE KEY-----"
            exit 1
          fi

      - name: Flutter config
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)
          echo "BUILD_NAME=$version" >> "$GITHUB_ENV"
          flutter pub get
          # Signing happens in the archive step with the API key; config-only must not look for local certificates.
          flutter build ios --release --config-only --no-codesign \
            --build-name="$version" --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=SADO_API_URL=https://sado.voxo.uz \
            --dart-define=TG_API_ID="$TG_API_ID" \
            --dart-define=TG_API_HASH="$TG_API_HASH"

      # Automatic signing needs a development profile for archiving, which needs a registered device.
      # Instead a throwaway distribution certificate + App Store profile is created through the API and
      # removed again in "Remove signing assets".
      - name: Signing assets
        env:
          ASC_KEY_FILE: ${{ runner.temp }}/asc/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
        run: |
          work="$RUNNER_TEMP/signing"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" tool/ios_ci_signing.py create uz.uzaro.app "$work"
          cat "$work/ids.env" >> "$GITHUB_ENV"
          source "$work/ids.env"

          p12_pass=$(openssl rand -hex 16)
          openssl x509 -inform DER -in "$work/cert.cer" -out "$work/cert.pem"
          openssl pkcs12 -export -legacy -inkey "$work/key.pem" -in "$work/cert.pem" -out "$work/cert.p12" -passout pass:"$p12_pass" 2>/dev/null \
            || openssl pkcs12 -export -inkey "$work/key.pem" -in "$work/cert.pem" -out "$work/cert.p12" -passout pass:"$p12_pass"
          kc="$RUNNER_TEMP/ci.keychain-db"
          kc_pass=$(openssl rand -hex 16)
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          security import "$work/cert.p12" -P "$p12_pass" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$kc_pass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')

          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$work/profile.mobileprovision" "$dir/$PROFILE_UUID.mobileprovision"
          done

          # Manual signing on the Runner target only; Pods and Swift packages stay unsigned frameworks.
          perl -0pi -e "s/(PRODUCT_BUNDLE_IDENTIFIER = uz\.uzaro\.app;)/\$1\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = $TEAM_ID;\n\t\t\t\tCODE_SIGN_IDENTITY = \"Apple Distribution\";\n\t\t\t\t\"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"Apple Distribution\";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";/g" ios/Runner.xcodeproj/project.pbxproj
          grep -c 'PROVISIONING_PROFILE_SPECIFIER = "UZARO_CI_' ios/Runner.xcodeproj/project.pbxproj

      - name: Archive
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive"

      - name: Export and upload
        run: |
          destination=export
          if [ "${{ inputs.upload }}" = "true" ]; then destination=upload; fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>${destination}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>uz.uzaro.app</key><string>${PROFILE_NAME}</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          if [ "$destination" = upload ]; then
            echo "::notice::Uploaded $BUILD_NAME ($GITHUB_RUN_NUMBER). It shows in App Store Connect > TestFlight after processing."
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.upload }}
        with:
          name: uzaro-ios-${{ env.BUILD_NAME }}-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14

      - name: Remove signing assets
        if: always()
        env:
          ASC_KEY_FILE: ${{ runner.temp }}/asc/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
        run: |
          if [ -f "$RUNNER_TEMP/signing/ids.env" ] && [ -x "$RUNNER_TEMP/venv/bin/python" ]; then
            "$RUNNER_TEMP/venv/bin/python" tool/ios_ci_signing.py cleanup "$RUNNER_TEMP/signing" || true
          fi
          security delete-keychain "$RUNNER_TEMP/ci.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/signing"
