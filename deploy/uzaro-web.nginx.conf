# nginx inside the uzaro-web container (mounted over /etc/nginx/conf.d/default.conf).
# Caddy in front adds TLS, compression and the security headers.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # Behind Caddy: /ru -> /ru/ must stay a relative redirect so it keeps https and the real host.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # site.css/site.js carry ?v=<hash> from the build, so long caching is safe; images change rarely.
    location ~* \.(?:css|js|webp|png|ico|svg|woff2)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
    }

    # The privacy policy lives at /privacy (linked from the app and the store listings).
    location ~ ^/(ru/|en/)?privacy$ {
        try_files /$1privacy.html =404;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
