<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Shashka</title>
<link rel="stylesheet" href="games.css?v=2">
<style>
  .piece { position: relative; z-index: 1; width: 78%; height: 78%; border-radius: 50%; box-shadow: inset 0 -4px 0 rgba(0,0,0,.25), 0 2px 4px rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; font-size: min(6vw, 28px); }
  .piece.w { background: #f7f3ea; color: #a8794f; }
  .piece.b { background: #2b2420; color: #e0b15a; }
  .piece.k::after { content: "♛"; }
  .sq.movable .piece { outline: 3px solid var(--mark); outline-offset: 1px; }
</style>
<script src="common.js?v=2" defer></script>
<script src="checkers.js?v=2" defer></script>
</head>
<body>
<h1 data-t="checkers">Shashka</h1>
<div class="bar">
  <button class="btn" type="button" data-mode="ai" data-t="vs_ai"></button>
  <button class="btn" type="button" data-mode="duo" data-t="two_players"></button>
</div>
<div class="bar" id="levels">
  <button class="btn" type="button" data-level="2" data-t="easy"></button>
  <button class="btn" type="button" data-level="5" data-t="medium"></button>
  <button class="btn" type="button" data-level="8" data-t="hard"></button>
</div>
<div class="board" id="board"></div>
<div class="status" id="status"></div>
<div class="bar">
  <button class="btn" type="button" id="undo" data-t="undo"></button>
  <span class="grow"></span>
  <button class="btn primary" type="button" id="new" data-t="new_game"></button>
</div>
</body>
</html>
