<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sudoku</title>
<link rel="stylesheet" href="games.css?v=2">
<style>
  .grid { display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr); width: 100%; aspect-ratio: 1; background: var(--panel); border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; user-select: none; }
  .cell { position: relative; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--panel); color: var(--brand); font: inherit; font-size: min(6vw, 28px); font-weight: 600; padding: 0; cursor: pointer; }
  .cell.given { color: var(--ink); font-weight: 800; }
  .cell.c2, .cell.c5 { border-right: 2px solid var(--ink); }
  .cell.r2, .cell.r5 { border-bottom: 2px solid var(--ink); }
  .cell.peer { background: color-mix(in srgb, var(--brand) 8%, var(--panel)); }
  .cell.same { background: color-mix(in srgb, var(--brand) 22%, var(--panel)); }
  .cell.sel { background: color-mix(in srgb, var(--brand) 38%, var(--panel)); }
  .cell.wrong { color: var(--bad); }
  .notes { position: absolute; inset: 2px; display: grid; grid-template-columns: repeat(3, 1fr); font-size: min(2.3vw, 11px); color: var(--muted); font-weight: 500; line-height: 1; }
  .notes span { display: flex; align-items: center; justify-content: center; }
  .pad { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; margin-top: 12px; }
  .pad button { aspect-ratio: 1 / 1.2; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); font: inherit; font-size: 22px; font-weight: 700; cursor: pointer; padding: 0; }
  .pad button:disabled { opacity: .25; }
  .stats { display: flex; justify-content: space-between; margin: 0 0 8px; font-weight: 600; font-size: 14px; }
</style>
<script src="common.js?v=2" defer></script>
<script src="sudoku.js?v=2" defer></script>
</head>
<body>
<h1 data-t="sudoku">Sudoku</h1>
<div class="bar">
  <button class="btn" type="button" data-level="easy" data-t="easy"></button>
  <button class="btn" type="button" data-level="medium" data-t="medium"></button>
  <button class="btn" type="button" data-level="hard" data-t="hard"></button>
</div>
<div class="stats">
  <span><span data-t="mistakes"></span>: <b id="mistakes">0</b></span>
  <span><span data-t="time"></span>: <b id="time">0:00</b></span>
</div>
<div class="grid" id="grid"></div>
<div class="bar" style="margin-top:12px">
  <button class="btn" type="button" id="notes" data-t="notes" aria-pressed="false"></button>
  <button class="btn" type="button" id="erase" data-t="erase"></button>
  <button class="btn" type="button" id="hint" data-t="hint"></button>
  <span class="grow"></span>
  <button class="btn primary" type="button" id="new" data-t="new_game"></button>
</div>
<div class="pad" id="pad"></div>
</body>
</html>
